version: '3.8'
services:
  web:
    build: .
    container_name: hoaem-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - flower-net

  db:
    image: mysql:8.0
    container_name: hoaem-db
    restart: always
    environment:
      MYSQL_DATABASE: hoavaem
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - flower-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hoaem-phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - flower-net

volumes:
  db_data:

networks:
  flower-net:
    driver: bridge